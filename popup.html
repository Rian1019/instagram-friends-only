<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Friends Only</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark">F</div>
        <div><strong>Friends Only</strong><span>for Instagram</span></div>
      </header>

      <section class="status-card">
        <span class="status-dot"></span>
        <div><strong>Personal accounts supported</strong><span>You sign in directly on instagram.com.</span></div>
      </section>

      <button id="open-home" class="primary">Friends feed & stories <span>→</span></button>
      <div class="shortcut-row">
        <button id="open-inbox" class="secondary">Messages</button>
        <button id="open-requests" class="secondary">Requests</button>
      </div>

      <label class="toggle-row">
        <div><strong>Friends-only mode</strong><span>Keep followed posts and stories; hide recommendations, ads, Reels, and Explore</span></div>
        <input id="focus-toggle" type="checkbox" />
        <i></i>
      </label>

      <footer>The extension does not read passwords, cookies, or messages.</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
